# Saves fresh Ticketmaster events to Supabase once a day, alongside the venue websites. Run it by hand from the Actions tab too.
# Needs the TICKETMASTER_API_KEY, SUPABASE_URL and SUPABASE_SERVICE_KEY repository secrets.
name: Refresh events

on:
  schedule:
    # Off the hour, because GitHub delays scheduled runs most at the top of the hour.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch events and save them to Supabase
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-events.ts
